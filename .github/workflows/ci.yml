name: CI Checks (Lint, K8s Validate & FastAPI Tests)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, K8s Validate & FastAPI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies (make install-ci)
        run: make install-ci

      - name: Run All Checks (make check)
        run: make check

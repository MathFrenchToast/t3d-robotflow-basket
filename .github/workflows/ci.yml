name: CI Checks (Lint, K8s Validate & FastAPI Tests)

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Lint, K8s Validate & FastAPI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies for CI checks
        run: |
          python -m pip install --upgrade pip
          pip install ruff yamllint pytest httpx fastapi uvicorn python-multipart python-dotenv opencv-python-headless numpy supervision

      - name: Run Linter (make lint)
        run: make lint

      - name: Validate Kubernetes Manifests (make validate)
        run: make validate

      - name: Run FastAPI & Homography Tests (make test)
        run: make test

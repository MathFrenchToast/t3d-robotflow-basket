[project]
name = "basketball-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.14",
    "inference-gpu[sam]>=1.2.13",
    "num2words>=0.5.14",
    "opencv-python>=4.10.0.84",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.28",
    "sam3>=0.1.4",
    "scikit-learn",
    "sports",
    "supervision>=0.28.0",
    "tqdm>=4.67.3",
    "transformers>=4.46.0",
    "uvicorn>=0.47.0",
]

[tool.uv.sources]
sports = { git = "https://github.com/roboflow/sports.git", rev = "feat/basketball" }

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "yamllint>=1.35.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]



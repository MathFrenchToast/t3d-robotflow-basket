apiVersion: apps/v1
kind: Deployment
metadata:
  name: t3d-sport-api
  namespace: t3d
  labels:
    app.kubernetes.io/name: t3d-sport-api
    app.kubernetes.io/part-of: t3d
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: t3d-sport-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: t3d-sport-api
        app.kubernetes.io/part-of: t3d
    spec:
      containers:
        - name: api
          image: ghcr.io/mathfrenchtoast/t3d-robotflow-basket:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: t3d-sport-api-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5

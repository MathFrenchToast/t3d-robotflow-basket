apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: t3d-sport-api-route
  namespace: t3d
  labels:
    app.kubernetes.io/name: t3d-sport-api
    app.kubernetes.io/part-of: t3d
spec:
  hostnames:
    - api.t3d.frenchtoast.dev
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: t3d-gateway
      namespace: traefik
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: t3d-sport-api
          port: 8000
          weight: 1

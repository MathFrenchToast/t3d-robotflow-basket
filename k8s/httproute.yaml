apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: t3d-sport-api-route
  namespace: t3d
  labels:
    app.kubernetes.io/name: t3d-sport-api
    app.kubernetes.io/part-of: t3d
spec:
  parentRefs:
    - name: t3d-gateway
      namespace: traefik
  hostnames:
    - "api.t3d.frenchtoast.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: t3d-ip-allowlist
      backendRefs:
        - name: t3d-sport-api
          port: 8000

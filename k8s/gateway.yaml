apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-t3d-prod
spec:
  acme:
    email: mathieuv@frenchtoast.dev
    privateKeySecretRef:
      name: letsencrypt-t3d-prod-account-key
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: t3d-gateway
                namespace: traefik
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: t3d-gateway-tls
  namespace: traefik
spec:
  dnsNames:
    - api.t3d.frenchtoast.dev
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-t3d-prod
  secretName: t3d-gateway-tls-secret
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: t3d-gateway
  namespace: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-t3d-prod
  labels:
    app.kubernetes.io/part-of: t3d
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 8000
      protocol: HTTP
      hostname: "api.t3d.frenchtoast.dev"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 8443
      protocol: HTTPS
      hostname: "api.t3d.frenchtoast.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: t3d-gateway-tls-secret
      allowedRoutes:
        namespaces:
          from: All
